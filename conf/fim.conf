# ==============================================================================
# File Integrity Checker (FIM) Configuration
# ==============================================================================

# Directories to monitor for changes (space or comma-separated)
# In production, typical directories include: /etc /bin /sbin /usr/bin
WATCH_DIRS="${WATCH_DIRS:-/etc /usr/local/bin}"

# Baseline database storage path (MUST be stored outside watched directories)
BASELINE_FILE="${BASELINE_FILE:-/var/lib/fim/baseline.db}"

# Track file metadata changes (permissions/mode, size, owner, mtime)
# Values: true | false (if false, only SHA-256 content changes are alerted)
CHECK_METADATA="true"

# Suppress standard informational output during scheduled cron/systemd runs
QUIET="false"
